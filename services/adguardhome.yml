services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || wget -q --spider http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp" # initial setup wizard; web UI moves to the port you choose
    volumes:
      - ../data/adguardhome/work:/opt/adguardhome/work
      - ../data/adguardhome/conf:/opt/adguardhome/conf
    labels:
      - traefik.enable=true
      - traefik.http.routers.adguard.rule=Host(`adguard.${DOMAIN}`)
      - traefik.http.routers.adguard.entrypoints=websecure
      - traefik.http.routers.adguard.tls=true
      - traefik.http.routers.adguard.tls.certresolver=letsencrypt
      - traefik.http.routers.adguard.tls.domains[0].main=${DOMAIN}
      - traefik.http.routers.adguard.tls.domains[0].sans=*.${DOMAIN}
      - traefik.http.services.adguard.loadbalancer.server.port=80
